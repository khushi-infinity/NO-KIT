    <text x="460" y="485" font-size="18">Use sunlight to tell</text><text x="460" y="510" font-size="18">a story about time.</text>
    <text x="460" y="575" font-size="13">GOOD OUTSIDE · 20 MIN</text>
    <circle cx="835" cy="410" r="35" fill="#b8df58" stroke="#15384b" stroke-width="4"/><text x="885" y="418" font-size="25" font-weight="700">RAIN MEASURER</text>
    <text x="815" y="485" font-size="18">Compare how much</text><text x="815" y="510" font-size="18">rain falls.</text>
